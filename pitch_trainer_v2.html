<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>音程あわせ練習 v2</title><style>body{font-family:system-ui,sans-serif;background:#101827;color:#f4f7ff;max-width:620px;margin:16px auto;padding:16px;line-height:1.6}button,select{font-size:1rem;padding:13px;border-radius:10px;border:0;margin:5px}button{background:#7db5ff;color:#081321;font-weight:bold}.panel{background:#1e2b40;border-radius:16px;padding:18px;margin:14px 0}.big{font-size:2.3rem;font-weight:700}.muted{color:#bcd0ed}.meter{height:18px;background:#43526b;border-radius:9px;position:relative;margin:25px 0}.center{position:absolute;left:50%;height:30px;top:-6px;border-left:3px solid #fff}.dot{position:absolute;top:-5px;height:28px;width:12px;border-radius:8px;background:#ffcc6b;left:calc(50% - 6px)}.warning{color:#ffd18b;white-space:pre-wrap}small{color:#bcd0ed}</style></head><body><h1>🎵 音程あわせ練習 v2</h1><p>まずは「お手本を鳴らす」で音が聞こえるか試そう。</p><div class="panel"><label for="note">お手本の音：</label><select id="note"><option value="130.81">ド3（C3）</option><option value="146.83" selected>レ3（D3）</option><option value="164.81">ミ3（E3）</option><option value="174.61">ファ3（F3）</option><option value="196">ソ3（G3）</option><option value="220">ラ3（A3）</option><option value="246.94">シ3（B3）</option><option value="261.63">ド4（C4）</option></select><p><button id="play">▶ お手本を鳴らす</button></p><div id="playstatus" class="muted" role="status">まだ再生していません</div><p><button id="start">🎙 マイク開始</button><button id="stop">停止</button></p><div id="status" class="muted" role="status">マイクはHTTPSで開いたときに利用できます。</div></div><div class="panel"><div>あなたの声</div><div class="big" id="hz">—</div><div id="result">マイクを開始すると判定します</div><div class="meter"><div class="center"></div><div class="dot" id="dot"></div></div><small>左＝低い ／ 中央＝一致 ／ 右＝高い（±100セント）</small></div><div class="panel"><strong>マイクが使えない場合</strong><p class="muted">ダウンロードしたHTMLを直接開くと、Androidではマイクが拒否されることがあります。マイクを使うにはHTTPSのWebサイトとして公開して開く必要があります。音声は端末内で解析し、保存・送信しません。</p><div id="environment" class="warning"></div></div><script>
'use strict';let ctx,stream,analyser,raf,buffer;const $=id=>document.getElementById(id);const AudioCtx=window.AudioContext||window.webkitAudioContext;const set=(id,msg)=>$(id).textContent=msg;
function makeWav(frequency){const rate=22050,duration=1.15,samples=Math.floor(rate*duration),data=new ArrayBuffer(44+samples*2),v=new DataView(data);const str=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};str(0,'RIFF');v.setUint32(4,36+samples*2,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,samples*2,true);for(let i=0;i<samples;i++){const t=i/rate,fade=Math.min(1,t/.035,(duration-t)/.16),wave=Math.sin(2*Math.PI*frequency*t)*.65+Math.sin(2*Math.PI*frequency*2*t)*.12;v.setInt16(44+i*2,Math.round(32767*.48*Math.max(0,fade)*wave),true)}return new Blob([data],{type:'audio/wav'})}
let player=null,playerUrl=null;async function play(){const f=Number($('note').value);set('playstatus','再生を試しています…');if(player){player.pause();player=null}if(playerUrl){URL.revokeObjectURL(playerUrl);playerUrl=null}try{playerUrl=URL.createObjectURL(makeWav(f));player=new Audio(playerUrl);player.volume=1;await player.play();set('playstatus','▶ 再生中。聞こえなければスマホのメディア音量を確認してください。');player.onended=()=>set('playstatus','再生終了。音は聞こえましたか？')}catch(e){set('playstatus','再生できませんでした：'+e.name+' / '+e.message)}}$('play').addEventListener('click',play);
async function start(){if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){set('status','この開き方ではマイクを利用できません。HTTPSのURLで開いてください。');return}try{if(!AudioCtx)throw Error('このブラウザは音声解析に対応していません');stop(false);ctx=ctx||new AudioCtx();await ctx.resume();stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});analyser=ctx.createAnalyser();analyser.fftSize=4096;buffer=new Float32Array(analyser.fftSize);ctx.createMediaStreamSource(stream).connect(analyser);set('status','マイク使用中。声で「んー」と真似してね。');tick()}catch(e){set('status','マイクを利用できません：'+e.name+' / '+e.message)}}function stop(show=true){if(raf)cancelAnimationFrame(raf);raf=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(show)set('status','停止しました')}$('start').addEventListener('click',start);$('stop').addEventListener('click',()=>stop());
function pitch(buf,sr){let rms=0;for(const x of buf)rms+=x*x;rms=Math.sqrt(rms/buf.length);if(rms<.015)return null;const min=Math.floor(sr/450),max=Math.floor(sr/75),n=buf.length;let best=0,lag=0;for(let k=min;k<=max;k++){let s=0,a=0,b=0;for(let i=0;i<n-k;i+=2){let x=buf[i],y=buf[i+k];s+=x*y;a+=x*x;b+=y*y}let corr=s/Math.sqrt(a*b+1e-10);if(corr>best){best=corr;lag=k}}return best>.78?sr/lag:null}function tick(){if(!analyser)return;analyser.getFloatTimeDomainData(buffer);let f=pitch(buffer,ctx.sampleRate);if(f){let target=Number($('note').value),cents=1200*Math.log2(f/target);set('hz',f.toFixed(1)+' Hz');$('dot').style.left=`calc(${50+Math.max(-100,Math.min(100,cents))/2}% - 6px)`;set('result',Math.abs(cents)<25?'🎉 かなり近い！':cents<0?'⬆ もう少し高く':'⬇ もう少し低く')}else{set('hz','—');set('result','声を出してみてね')}raf=requestAnimationFrame(tick)}set('environment','ページの種類：'+location.protocol+' ／ 安全な接続：'+(window.isSecureContext?'はい':'いいえ'));
</script></body></html>
